version: '3.8'

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    restart: unless-stopped
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      # The database connection string is already present in appsettings.json,
      # but it can be overridden here if desired:
      # - ConnectionStrings__DefaultConnection=Host=...
